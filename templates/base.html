<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoEnergy{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #123d26; /* Tono verde oscuro corporativo acorde al boceto */
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="{% url 'dispositivos:inicio' %}">
                EcoEnergy
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white-50 active px-3" href="{% url 'dispositivos:inicio' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 px-3" href="{% url 'dispositivos:inicio' %}">Zonas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 fw-semibold" href="{% url 'dispositivos:resumen_zonas' %}">Resumen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal de la aplicación -->
    <main class="container mb-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            &copy; 2026 EcoEnergy - Plataforma de Monitoreo y Gestión Energética
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
